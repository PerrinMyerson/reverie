name: Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # uv ships standalone CPython builds, including 3.9, which newer
      # runner images no longer provide through setup-python.
      - uses: astral-sh/setup-uv@v6
      - name: Build the CLI (for CLI-parity tests)
        run: cargo build -p reverie-cli
      - name: Install package
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv maturin pytest numpy
          if [ -d .venv/Scripts ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          VIRTUAL_ENV="$PWD/.venv" "$bin/maturin" develop
          dir="$PWD/$bin"
          if command -v cygpath >/dev/null; then dir=$(cygpath -w "$dir"); fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: pytest
        run: python -m pytest -v
      - name: Research script self-tests
        run: |
          python scripts/exact_unlearning_experiment.py --self-test
          python scripts/reversibility_report.py --self-test

  linux:
    name: wheels (manylinux ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: wheels (macOS ${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: wheels (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  wheel-smoke:
    name: installed wheel smoke test
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install wheel and run tests against it
        run: |
          uv venv --python 3.9 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" pytest dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -v "$GITHUB_WORKSPACE/python/tests"
