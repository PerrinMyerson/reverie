[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "reverie-lang"
description = "Python bindings for Reverie, a statically typed reversible programming language"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["reversible computing", "programming language", "interpreter", "janus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/PerrinMyerson/reverie"

[tool.maturin]
manifest-path = "crates/reverie-py/Cargo.toml"
python-source = "python"
module-name = "reverie._reverie"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
